# Tuned cluster for project 01.
#
# - worker:  default kubelet (CPU manager "none"), takes general workloads.
# - worker2: latency node. Static CPU manager with core 0 (CPUs 0 and 4, SMT
#            siblings) reserved for system/kube daemons, so Guaranteed pods
#            with integer CPU requests get exclusive cores. The reserved set
#            matches HOUSEKEEPING in scripts/host-tuning.sh. Tainted so only
#            pods that tolerate it land there.
#
# kind nodes share the host kernel, so huge pages must be reserved on the host
# before creating the cluster (`make hugepages-on`); the kubelet reports them as
# node capacity at startup. Needs >= 4 host CPUs.
#
# kubeletExtraArgs is the kubeadm v1beta3 map form used by kind v0.20 - v0.27.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
    labels:
      billy-kube/pool: latency
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: billy-kube/latency
              value: "true"
              effect: NoSchedule
          kubeletExtraArgs:
            cpu-manager-policy: "static"
            reserved-cpus: "0,4"
            topology-manager-policy: "best-effort"
