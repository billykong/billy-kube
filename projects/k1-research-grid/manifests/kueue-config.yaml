# Replaces the release's kueue-manager-config. Differences from the release
# default: only batch/job is integrated (M1), and Kueue manages Jobs only in
# grid team namespaces. Fair sharing and waitForPodsReady come in M3.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kueue-manager-config
  namespace: kueue-system
  labels:
    app.kubernetes.io/name: kueue
    control-plane: controller-manager
data:
  controller_manager_config.yaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta2
    kind: Configuration
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: :8443
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: c1f6bfd2.kueue.x-k8s.io
    controller:
      groupKindConcurrency:
        Job.batch: 5
        Pod: 5
        Workload.kueue.x-k8s.io: 10
        LocalQueue.kueue.x-k8s.io: 5
        Cohort.kueue.x-k8s.io: 1
        ClusterQueue.kueue.x-k8s.io: 5
        ResourceFlavor.kueue.x-k8s.io: 1
    clientConnection:
      qps: 300
      burst: 500
    managedJobsNamespaceSelector:
      matchLabels:
        billy-kube/grid-team: "true"
    integrations:
      frameworks:
        - batch/job
