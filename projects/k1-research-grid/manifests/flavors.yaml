# Capacity types. sim-* are KWOK nodes (scheduling at grid scale, no real
# containers); real is the kind worker, which runs actual containers.
# Pods admitted on a sim flavor get the KWOK toleration added by Kueue.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: sim-cpu
spec:
  nodeLabels:
    billy-kube/pool: grid-sim
    billy-kube/node-type: cpu
  nodeTaints:
    - key: kwok.x-k8s.io/node
      value: fake
      effect: NoSchedule
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: sim-gpu
spec:
  nodeLabels:
    billy-kube/pool: grid-sim
    billy-kube/node-type: gpu
  nodeTaints:
    - key: kwok.x-k8s.io/node
      value: fake
      effect: NoSchedule
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: real
spec:
  nodeLabels:
    billy-kube/pool: grid-real
