# Baseline: same node, same noise, but Burstable QoS and no huge pages, so the
# benchmark shares CPUs with the noise pod and the kube/system daemons.
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-baseline
  namespace: latency-bench
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        billy-kube/pool: latency
      tolerations:
        - key: billy-kube/latency
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: bench
          image: billy-kube/bench:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: VARIANT
              value: baseline
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HUGEPAGES
              value: "0"
          securityContext:
            capabilities:
              add: ["SYS_NICE", "IPC_LOCK"]
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
